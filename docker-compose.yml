services:
  postgres:
    image: postgres:17-alpine
    container_name: toolbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolbox
      POSTGRES_PASSWORD: toolbox
      POSTGRES_DB: toolbox
    ports:
      - "5432:5432"
    volumes:
      - toolbox_postgres_data:/var/lib/postgresql/data

volumes:
  toolbox_postgres_data:
